<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">Benchmark Case Execution Engine</title>
  <desc id="desc">An English architecture diagram showing the case queue, scheduler-specific lifecycle, Kubernetes runtime, telemetry pipeline, and result aggregation.</desc>
  <defs>
    <linearGradient id="engine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#164f80"/><stop offset="1" stop-color="#2c83bb"/></linearGradient>
    <linearGradient id="cluster" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8fcff"/><stop offset="1" stop-color="#edf7fd"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#476b89"/></marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3589c4"/></marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8065c0"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#18324a}.title{font-size:34px;font-weight:760}.section{font-size:15px;font-weight:720;fill:#557087;letter-spacing:1.2px}.h2{font-size:20px;font-weight:740}.h3{font-size:15px;font-weight:720}.body{font-size:14px;fill:#567086}.small{font-size:13px;fill:#657d91}.tiny{font-size:12px;fill:#70869a}.stageTitle{font-size:14px;font-weight:720;fill:#fff}.stageSub{font-size:12px;fill:#d8ecfb}.card{fill:#fff;stroke:#c7d7e3;stroke-width:1.5;filter:url(#shadow)}.flow{fill:none;stroke:#476b89;stroke-width:2.4;marker-end:url(#arrow)}.control{fill:none;stroke:#3589c4;stroke-width:2.3;marker-end:url(#blueArrow)}.observe{fill:none;stroke:#8065c0;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#purpleArrow)}
    </style>
  </defs>

  <text x="60" y="55" class="title">Benchmark Case Execution Engine</text>
  <rect x="1340" y="34" width="400" height="48" rx="24" fill="#e0eef8" stroke="#b6cde0"/><text x="1540" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#245a84">Case = Scenario × Scheduler × Plugin-config</text>
  <text x="55" y="127" class="section">01 CASE QUEUE</text><text x="340" y="127" class="section">02 CASE LIFECYCLE</text><text x="710" y="127" class="section">03 KUBERNETES RUNTIME</text><text x="1475" y="127" class="section">04 RESULT</text>

  <!-- Queue -->
  <rect x="50" y="145" width="250" height="840" class="card"/><rect x="50" y="145" width="250" height="9" rx="4" fill="#3b8fd1"/>
  <circle cx="91" cy="191" r="21" fill="#e0eef9"/><text x="91" y="198" text-anchor="middle" font-size="17" font-weight="760" fill="#2877b2">R</text><text x="126" y="190" class="h2">Run Coordinator</text><text x="78" y="229" class="small">Dispatches cases in plan order</text>
  <text x="78" y="276" class="h3">CASE QUEUE</text>
  <rect x="76" y="296" width="198" height="82" rx="12" fill="#edf6fd" stroke="#90bee0" stroke-width="1.5"/><rect x="76" y="296" width="7" height="82" rx="3" fill="#3b8fd1"/><text x="100" y="323" class="h3">Case 01</text><text x="100" y="347" class="small">scenario-1 · Kueue</text><text x="100" y="367" class="tiny">iteration 1 / 1</text>
  <rect x="76" y="391" width="198" height="82" rx="12" fill="#fff4e6" stroke="#e9b366" stroke-width="1.5"/><rect x="76" y="391" width="7" height="82" rx="3" fill="#ed9728"/><text x="100" y="418" class="h3">Case 02 · Running</text><text x="100" y="442" class="small">scenario-1 · Volcano</text><text x="100" y="462" class="tiny">batch · iteration 1 / 1</text>
  <rect x="76" y="486" width="198" height="82" rx="12" fill="#f5f2fb" stroke="#bba9df" stroke-width="1.5"/><rect x="76" y="486" width="7" height="82" rx="3" fill="#8267c4"/><text x="100" y="513" class="h3">Case 03</text><text x="100" y="537" class="small">scenario-1 · YuniKorn</text><text x="100" y="557" class="tiny">iteration 1 / 1</text>
  <rect x="76" y="581" width="198" height="62" rx="12" fill="#f5f8fa" stroke="#d2dde5"/><text x="175" y="618" text-anchor="middle" class="body">··· remaining cases</text>
  <rect x="76" y="681" width="198" height="118" rx="12" fill="#f4f7fa"/><text x="98" y="711" class="h3">Run Policy</text><text x="98" y="740" class="small">• Serial, isolated execution</text><text x="98" y="766" class="small">• Record and clean up failures</text><text x="98" y="792" class="small">• Preserve scenario comparisons</text>
  <rect x="76" y="835" width="198" height="108" rx="12" fill="#e7f4fb"/><text x="98" y="866" class="h3">Current Case</text><text x="98" y="894" class="small">ID: s1-volcano-i1</text><text x="98" y="919" class="small">Status: RUNNING</text>

  <!-- Lifecycle -->
  <path d="M300 460H330" class="flow"/><rect x="330" y="145" width="330" height="840" rx="18" fill="url(#engine)" filter="url(#shadow)"/>
  <text x="360" y="187" font-size="21" font-weight="750" style="fill:#fff">Case Execution Engine</text><text x="360" y="214" class="stageSub">Fixed state machine · plugin-driven implementation</text>

  <rect x="360" y="250" width="270" height="91" rx="13" fill="#fff" fill-opacity=".14" stroke="#93c9ea"/><circle cx="391" cy="280" r="17" fill="#dceeff"/><text x="391" y="286" text-anchor="middle" font-size="14" font-weight="750" fill="#246a9d">1</text><text x="421" y="282" class="stageTitle">Prepare-&lt;scheduler&gt;</text><text x="381" y="307" class="stageSub">Enable target components; reload config;</text><text x="381" y="325" class="stageSub">scale others to zero and wait until ready</text>
  <path d="M495 341V361" fill="none" stroke="#dcefff" stroke-width="2" marker-end="url(#blueArrow)"/>
  <rect x="360" y="364" width="270" height="91" rx="13" fill="#fff" fill-opacity=".14" stroke="#93c9ea"/><circle cx="391" cy="394" r="17" fill="#e9e2fb"/><text x="391" y="400" text-anchor="middle" font-size="14" font-weight="750" fill="#6850a5">2</text><text x="421" y="396" class="stageTitle">Start-&lt;scheduler&gt;</text><text x="381" y="421" class="stageSub">Restart Exporter for this case only;</text><text x="381" y="439" class="stageSub">render and submit Queue / Job / Pod</text>
  <path d="M495 455V475" fill="none" stroke="#dcefff" stroke-width="2" marker-end="url(#blueArrow)"/>
  <rect x="360" y="478" width="270" height="91" rx="13" fill="#fff" fill-opacity=".22" stroke="#c5e5f7" stroke-width="1.5"/><circle cx="391" cy="508" r="17" fill="#e3f5eb"/><text x="391" y="514" text-anchor="middle" font-size="14" font-weight="750" fill="#27865a">3</text><text x="421" y="510" class="stageTitle">End-&lt;scheduler&gt;</text><text x="381" y="535" class="stageSub">Wait for completion, failure, and metrics;</text><text x="381" y="553" class="stageSub">clean resources and verify cleanup</text>
  <path d="M495 569V589" fill="none" stroke="#dcefff" stroke-width="2" marker-end="url(#blueArrow)"/>
  <rect x="360" y="592" width="270" height="91" rx="13" fill="#fff" fill-opacity=".22" stroke="#c5e5f7" stroke-width="1.5"/><circle cx="391" cy="622" r="17" fill="#fff0dc"/><text x="391" y="628" text-anchor="middle" font-size="14" font-weight="750" fill="#a66612">4</text><text x="421" y="624" class="stageTitle">Save-&lt;scheduler&gt;-result</text><text x="381" y="649" class="stageSub">Read audit.log and generate latency</text><text x="381" y="667" class="stageSub">and throughput performance reports</text>
  <path d="M495 683V703" fill="none" stroke="#dcefff" stroke-width="2" marker-end="url(#blueArrow)"/>
  <rect x="360" y="706" width="270" height="91" rx="13" fill="#fff" fill-opacity=".14" stroke="#93c9ea"/><circle cx="391" cy="736" r="17" fill="#e9e2fb"/><text x="391" y="742" text-anchor="middle" font-size="14" font-weight="750" fill="#6850a5">5</text><text x="421" y="738" class="stageTitle">Save-result</text><text x="381" y="763" class="stageSub">If SCHEDULERS=ALL, export Grafana</text><text x="381" y="781" class="stageSub">comparisons and performance curves</text>
  <path d="M495 797V817" fill="none" stroke="#dcefff" stroke-width="2" marker-end="url(#blueArrow)"/>
  <rect x="360" y="820" width="270" height="91" rx="13" fill="#fff" fill-opacity=".14" stroke="#93c9ea"/><circle cx="391" cy="850" r="17" fill="#f2e9ed"/><text x="391" y="856" text-anchor="middle" font-size="14" font-weight="750" fill="#8b596e">6</text><text x="421" y="852" class="stageTitle">Finalize</text><text x="381" y="880" class="stageSub">Perform final cleanup and restore the baseline</text>
  <rect x="360" y="938" width="270" height="25" rx="12" fill="#fff" fill-opacity=".17"/><text x="495" y="955" text-anchor="middle" class="stageSub">Every outcome emits a Case Result</text>

  <!-- Runtime -->
  <path d="M630 523H700" class="control"/><rect x="700" y="145" width="720" height="840" rx="28" fill="url(#cluster)" stroke="#3f91ca" stroke-width="3" stroke-dasharray="10 8"/>
  <rect x="835" y="160" width="450" height="105" rx="52" fill="#fff" stroke="#b7d6ea" filter="url(#shadow)"/><image href="kind-removebg-preview.png" x="875" y="154" width="168" height="105" preserveAspectRatio="xMidYMid meet"/><text x="1070" y="199" class="h2">Kind + KWOK Cluster</text><text x="1070" y="226" class="small">Current Case: Volcano Batch</text>
  <text x="765" y="327" class="h2">Active Scheduler Stack</text><text x="765" y="352" class="tiny">Only the target scheduler stack is active for this case</text>
  <image href="volcano-removebg-preview.png" x="763" y="372" width="54" height="31"/><text x="829" y="394" class="h3">volcano-scheduler</text><image href="volcano-removebg-preview.png" x="763" y="418" width="54" height="31"/><text x="829" y="440" class="h3">volcano-controllers</text><image href="volcano-removebg-preview.png" x="763" y="464" width="54" height="31"/><text x="829" y="486" class="h3">volcano-admission</text>
  <rect x="1060" y="292" width="325" height="234" rx="16" fill="#edf6fd" stroke="#9bc6e3" stroke-width="1.5"/><text x="1090" y="327" class="h2">Shared Control Plane</text>
  <circle cx="1113" cy="378" r="24" fill="#397fc4"/><text x="1113" y="384" text-anchor="middle" font-size="13" font-weight="750" fill="#fff">K8s</text><text x="1150" y="383" class="h3">kube-apiserver</text><circle cx="1113" cy="433" r="24" fill="#397fc4"/><text x="1113" y="439" text-anchor="middle" font-size="13" font-weight="750" fill="#fff">K8s</text><text x="1150" y="438" class="h3">controller-manager</text><circle cx="1113" cy="488" r="24" fill="#397fc4"/><text x="1113" y="494" text-anchor="middle" font-size="13" font-weight="750" fill="#fff">K8s</text><text x="1150" y="493" class="h3">KWOK nodes</text>

  <rect x="735" y="552" width="650" height="176" rx="18" fill="#fff" stroke="#bfd3e2" stroke-width="1.5"/><text x="765" y="586" class="h2">Workload</text>
  <rect x="770" y="615" width="125" height="76" rx="12" fill="#e7f3fb" stroke="#99c5e2"/><text x="832" y="646" text-anchor="middle" class="h3">Queue</text><text x="832" y="670" text-anchor="middle" class="tiny">capacity / quota</text><path d="M895 653H940" class="control"/>
  <rect x="944" y="605" width="135" height="38" rx="9" fill="#fff2e2" stroke="#efbd7d"/><text x="1011" y="629" text-anchor="middle" class="small">Job 001</text><rect x="944" y="650" width="135" height="38" rx="9" fill="#fff2e2" stroke="#efbd7d"/><text x="1011" y="674" text-anchor="middle" class="small">Job 002 ···</text><path d="M1079 653H1124" class="control"/>
  <g fill="#59a8d7"><circle cx="1152" cy="621" r="10"/><circle cx="1182" cy="621" r="10"/><circle cx="1212" cy="621" r="10"/><circle cx="1242" cy="621" r="10"/><circle cx="1272" cy="621" r="10"/><circle cx="1302" cy="621" r="10"/><circle cx="1152" cy="653" r="10"/><circle cx="1182" cy="653" r="10"/><circle cx="1212" cy="653" r="10"/><circle cx="1242" cy="653" r="10"/><circle cx="1272" cy="653" r="10"/><circle cx="1302" cy="653" r="10"/><circle cx="1152" cy="685" r="10"/><circle cx="1182" cy="685" r="10"/><circle cx="1212" cy="685" r="10"/><circle cx="1242" cy="685" r="10"/><circle cx="1272" cy="685" r="10"/><circle cx="1302" cy="685" r="10"/></g><text x="1345" y="658" class="small">Pods</text>
  <path d="M1220 526V550" class="control"/>

  <rect x="735" y="752" width="650" height="196" rx="18" fill="#f7f3fc" stroke="#cbbce7" stroke-width="1.5"/><text x="765" y="786" class="h2">Telemetry Pipeline</text>
  <rect x="766" y="813" width="135" height="92" rx="12" fill="#fff" stroke="#d3c8e7"/><path d="M795 835H871V883H795Z" fill="#f1edf8" stroke="#8065c0"/><path d="M807 847H858M807 859H858M807 871H847" stroke="#8065c0" stroke-width="2"/><text x="833" y="924" text-anchor="middle" class="tiny">API Audit Log</text><path d="M901 857H939" class="observe"/>
  <rect x="942" y="813" width="150" height="92" rx="12" fill="#fff" stroke="#d3c8e7"/><circle cx="977" cy="853" r="22" fill="#397fc4"/><text x="977" y="858" text-anchor="middle" font-size="11" font-weight="750" fill="#fff">K8s</text><text x="1013" y="846" class="small">Audit</text><text x="1013" y="866" class="small">Exporter</text><text x="1017" y="924" text-anchor="middle" class="tiny">Case label + /metrics</text><path d="M1092 857H1134" class="observe"/>
  <image href="prometheus-removebg-preview.png" x="1136" y="807" width="82" height="74"/><text x="1177" y="924" text-anchor="middle" class="tiny">Prometheus</text><path d="M1220 857H1254" class="observe"/><image href="grafana-removebg-preview.png" x="1260" y="816" width="67" height="72"/><text x="1294" y="924" text-anchor="middle" class="tiny">Grafana</text><path d="M1220 526C1220 560 1328 735 1328 809" class="observe"/>

  <!-- Result -->
  <path d="M1420 523H1465" class="flow"/><rect x="1465" y="145" width="285" height="840" class="card"/><rect x="1465" y="145" width="285" height="9" rx="4" fill="#4aaa79"/>
  <circle cx="1506" cy="191" r="21" fill="#e3f5eb"/><text x="1506" y="198" text-anchor="middle" font-size="17" font-weight="760" fill="#27865a">✓</text><text x="1541" y="190" class="h2">Case Result</text>
  <rect x="1493" y="262" width="229" height="82" rx="12" fill="#edf6fd"/><text x="1516" y="292" class="h3">Manifest</text><text x="1516" y="317" class="small">Config · versions · environment</text>
  <rect x="1493" y="358" width="229" height="82" rx="12" fill="#f4f7fa"/><text x="1516" y="388" class="h3">Status &amp; Window</text><text x="1516" y="413" class="small">Success / failure · start / end time</text>
  <rect x="1493" y="454" width="229" height="82" rx="12" fill="#f4effa"/><text x="1516" y="484" class="h3">Raw Evidence</text><text x="1516" y="509" class="small">Audit · logs · metrics</text>
  <rect x="1493" y="550" width="229" height="82" rx="12" fill="#e8f5ee"/><text x="1516" y="580" class="h3">Performance</text><text x="1516" y="604" class="small">Latency · throughput</text><text x="1516" y="622" class="small">Binding window</text>
  <path d="M1607 652V692" class="flow"/><rect x="1493" y="698" width="229" height="205" rx="15" fill="#eef7f2" stroke="#aad4bd"/><text x="1516" y="732" class="h2">Run Aggregator</text><text x="1516" y="766" class="small">Multiple runs: mean / P50 / P95</text><text x="1516" y="793" class="small">Schedulers: side-by-side</text><text x="1516" y="820" class="small">Versions: performance trends</text><rect x="1516" y="844" width="183" height="35" rx="17" fill="#d9eee2"/><text x="1607" y="867" text-anchor="middle" class="small">Report + Dashboard</text><rect x="1493" y="926" width="229" height="37" rx="18" fill="#e3f1f8"/><text x="1607" y="950" text-anchor="middle" class="tiny">Final comparison after the run completes</text>

  <line x1="50" y1="1026" x2="95" y2="1026" stroke="#3589c4" stroke-width="2.3"/><text x="107" y="1031" class="tiny">Control path</text><line x1="205" y1="1026" x2="250" y2="1026" stroke="#8065c0" stroke-width="2.2" stroke-dasharray="7 5"/><text x="262" y="1031" class="tiny">Observation path</text><text x="1748" y="1031" text-anchor="end" class="tiny">Case Engine Architecture v2 · English</text>
  <text x="50" y="1060" class="tiny">Volcano Batch is shown as an example. Switching the Scheduler Plugin runs Kueue, Volcano Agent, or YuniKorn through the same lifecycle.</text>
</svg>
