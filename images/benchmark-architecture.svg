<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" role="img" aria-labelledby="title desc">
  <title id="title">Flexible, Pluggable K8s Scheduling Benchmark</title>
  <desc id="desc">Architecture of a Kubernetes scheduling benchmark with unified test selection, an orchestrator, four plugin types, reproducible outputs, and automation skills.</desc>
  <defs>
    <linearGradient id="engine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#174f7f"/><stop offset="1" stop-color="#287fb5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52728e"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#18324a}.title{font-size:34px;font-weight:760}.subtitle{font-size:17px;fill:#61788c}.section{font-size:16px;font-weight:720;fill:#567087;letter-spacing:1.2px}.h2{font-size:20px;font-weight:740}.h3{font-size:16px;font-weight:720}.body{font-size:14px;fill:#587188}.small{font-size:13px;fill:#687f93}.tiny{font-size:12px;fill:#72879a}.card{fill:#fff;stroke:#c5d5e2;stroke-width:1.5;filter:url(#shadow)}.wire{fill:none;stroke:#52728e;stroke-width:2}.line{fill:none;stroke:#52728e;stroke-width:2.1;marker-end:url(#arrow)}.white,.h2.white,.tiny.white{fill:#fff}.blueSub,.small.blueSub{fill:#d8ecfb}
    </style>
  </defs>

  <text x="70" y="58" class="title">Flexible, Pluggable K8s Scheduling Benchmark</text>
  <text x="70" y="88" class="subtitle">One execution engine · Four plugin types · Arbitrary test matrices · Reproducible results</text>
  <rect x="1400" y="38" width="330" height="48" rx="24" fill="#e2eef8" stroke="#b9cee0"/>
  <text x="1565" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#245a84">Case = Scenario × Scheduler × Plugin-config</text>

  <!-- Selection -->
  <text x="70" y="132" class="section">01 UNIFIED ENTRY / TEST SELECTION</text>
  <g>
    <rect x="70" y="150" width="270" height="76" class="card"/><circle cx="105" cy="188" r="17" fill="#dcecff"/><text x="105" y="193" text-anchor="middle" font-size="13" font-weight="700" fill="#24629a">ALL</text><text x="135" y="181" class="h3">Default Full Test</text><text x="135" y="204" class="small">All scenarios × all schedulers</text>
    <rect x="365" y="150" width="270" height="76" class="card"/><circle cx="400" cy="188" r="17" fill="#e0f4eb"/><text x="400" y="193" text-anchor="middle" font-size="13" font-weight="700" fill="#27805f">S</text><text x="430" y="181" class="h3">Select Scenarios</text><text x="430" y="204" class="small">One or more scenarios</text>
    <rect x="660" y="150" width="300" height="76" class="card"/><circle cx="695" cy="188" r="17" fill="#fff0d9"/><text x="695" y="193" text-anchor="middle" font-size="13" font-weight="700" fill="#a66612">T</text><text x="725" y="181" class="h3">Targeted Combination</text><text x="725" y="204" class="small">Scenario + scheduler + mode</text>
    <rect x="985" y="150" width="300" height="76" class="card"/><circle cx="1020" cy="188" r="17" fill="#eee7ff"/><text x="1020" y="193" text-anchor="middle" font-size="13" font-weight="700" fill="#6850a5">P</text><text x="1050" y="181" class="h3">Performance Test</text><text x="1050" y="204" class="small">Custom scenario + scheduler + statistics</text>
    <rect x="1310" y="150" width="420" height="76" rx="11" fill="#f4f7fa" stroke="#b7c8d7" stroke-dasharray="5 4"/><text x="1336" y="179" class="h3">Other Tests</text><text x="1336" y="204" class="small">Add scenario-custom or define a custom test matrix</text>
  </g>
  <path d="M205 226V258H1520" class="wire"/><path d="M500 226V258M810 226V258M1135 226V258M1520 226V258" class="wire"/>

  <!-- Orchestrator -->
  <text x="70" y="286" class="section">02 CONTROL PLANE / BENCHMARK ORCHESTRATOR</text>
  <rect x="70" y="304" width="1660" height="214" rx="18" fill="url(#engine)" filter="url(#shadow)"/>
  <rect x="105" y="340" width="320" height="137" rx="13" fill="#fff" fill-opacity=".10" stroke="#8cc6eb"/><text x="130" y="374" class="h2 white">Configuration Resolver</text><text x="130" y="402" class="small blueSub">Defaults → validation → overrides</text><text x="130" y="428" class="small blueSub">Validates runtime parameters and plugin capabilities</text><rect x="130" y="445" width="148" height="22" rx="11" fill="#d9edff" fill-opacity=".17"/><text x="204" y="460" text-anchor="middle" class="tiny white">Resolved Config</text>
  <path d="M425 409H487" stroke="#dcefff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="490" y="340" width="320" height="137" rx="13" fill="#fff" fill-opacity=".10" stroke="#8cc6eb"/><text x="515" y="374" class="h2 white">Execution Planner</text><text x="515" y="402" class="small blueSub">Expands the request into independent minimal cases</text><text x="515" y="428" class="small blueSub">Creates an ordered plan; does not execute it</text><rect x="515" y="445" width="146" height="22" rx="11" fill="#d9edff" fill-opacity=".17"/><text x="588" y="460" text-anchor="middle" class="tiny white">Execution Plan</text>
  <path d="M810 409H872" stroke="#dcefff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="875" y="329" width="385" height="159" rx="13" fill="#fff" fill-opacity=".16" stroke="#b8ddf5" stroke-width="1.5"/><text x="900" y="365" class="h2 white">Case Execution Engine</text><text x="900" y="393" class="small blueSub">Runs cases sequentially from the Execution Plan</text><text x="900" y="419" class="small blueSub">Tracks state and failures; restores the cluster baseline</text><rect x="900" y="443" width="328" height="26" rx="13" fill="#e7f5ff"/><text x="1064" y="461" text-anchor="middle" font-size="12" font-weight="700" fill="#1b5f8e">Each case is the minimum execution and archive unit</text>
  <path d="M1260 409H1322" stroke="#dcefff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1325" y="340" width="370" height="137" rx="13" fill="#fff" fill-opacity=".10" stroke="#8cc6eb"/><text x="1350" y="374" class="h2 white">Results &amp; Output</text><text x="1350" y="402" class="small blueSub">Builds latency reports from audit.log</text><text x="1350" y="428" class="small blueSub">Exports Grafana comparisons and verifies artifacts</text><rect x="1350" y="445" width="120" height="22" rx="11" fill="#d9edff" fill-opacity=".17"/><text x="1410" y="460" text-anchor="middle" class="tiny white">Run Context</text>

  <!-- Plugins -->
  <path d="M1067 488V553" class="wire"/><circle cx="1067" cy="553" r="6" fill="#55738e"/><path d="M280 553H1525" class="wire"/><path d="M280 553V578M695 553V578M1110 553V578M1525 553V578" class="wire"/>
  <text x="70" y="568" class="section">03 PLUGIN PLATFORM / PLUGGABLE</text>
  <g>
    <rect x="70" y="590" width="405" height="208" class="card"/><rect x="70" y="590" width="405" height="9" rx="4" fill="#3b8fd1"/><circle cx="112" cy="637" r="21" fill="#e1effb"/><text x="112" y="643" text-anchor="middle" font-size="18" font-weight="750" fill="#2876b2">S</text><text x="147" y="636" class="h2">Scenario Plugin</text><text x="147" y="659" class="small">Defines “what to test”</text><text x="100" y="700" class="small">• Workload model: queues, jobs, pods</text><text x="100" y="725" class="small">• Resources: CPU, memory, GPU, TTL</text><rect x="100" y="766" width="331" height="22" rx="11" fill="#edf6fd"/><text x="265" y="781" text-anchor="middle" class="tiny">Generated by injecting YAML templates</text>
    <rect x="490" y="590" width="405" height="208" class="card"/><rect x="490" y="590" width="405" height="9" rx="4" fill="#e3942d"/><circle cx="532" cy="637" r="21" fill="#fff0dc"/><text x="532" y="643" text-anchor="middle" font-size="18" font-weight="750" fill="#b76d10">A</text><text x="567" y="636" class="h2">Scheduler Plugin</text><text x="567" y="659" class="small">Defines “who schedules”</text><text x="520" y="700" class="small">• Volcano, kube-scheduler, YuniKorn, Kueue</text><text x="520" y="725" class="small">• Scheduler-specific Job templates</text><text x="520" y="750" class="small">• ConfigMap: interval, workers, and tuning</text><rect x="520" y="766" width="331" height="22" rx="11" fill="#fff5e8"/><text x="685" y="781" text-anchor="middle" class="tiny">Kueue · kube-scheduler · Volcano Agent/Batch · YuniKorn</text>
    <rect x="910" y="590" width="405" height="208" class="card"/><rect x="910" y="590" width="405" height="9" rx="4" fill="#8267c4"/><circle cx="952" cy="637" r="21" fill="#eee9fa"/><text x="952" y="643" text-anchor="middle" font-size="18" font-weight="750" fill="#6850a5">C</text><text x="987" y="636" class="h2">Feature Plugin</text><text x="987" y="659" class="small">Defines “which features run”</text><text x="940" y="700" class="small">• Gang scheduling / preemption / reclaim</text><text x="940" y="725" class="small">• Network topology and affinity</text><rect x="940" y="766" width="331" height="22" rx="11" fill="#f3effb"/><text x="1105" y="781" text-anchor="middle" class="tiny">Scheduler features · topology · affinity</text>
    <rect x="1330" y="590" width="400" height="208" class="card"/><rect x="1330" y="590" width="400" height="9" rx="4" fill="#4aaa79"/><circle cx="1372" cy="637" r="21" fill="#e2f5ea"/><text x="1372" y="643" text-anchor="middle" font-size="18" font-weight="750" fill="#27865a">E</text><text x="1407" y="636" class="h2">Environment Plugin</text><text x="1407" y="659" class="small">Defines “where the benchmark runs”</text><text x="1360" y="700" class="small">• Kind cluster: KWOK nodes and Pod parallelism</text><text x="1360" y="725" class="small">• Client QPS/Burst and submission rate</text><rect x="1360" y="766" width="326" height="22" rx="11" fill="#ebf8f0"/><text x="1523" y="781" text-anchor="middle" class="tiny">Controlled environment for fair comparisons</text>
  </g>

  <!-- Outputs -->
  <text x="70" y="846" class="section">04 DATA ARTIFACTS / REPRODUCIBLE OUTPUT</text>
  <rect x="70" y="868" width="1660" height="114" fill="#fff" stroke="#c5d5e2"/>
  <rect x="92" y="880" width="378" height="90" rx="45" fill="#e8f1f8"/><text x="281" y="910" text-anchor="middle" class="h3">Test Environment Record</text><text x="281" y="934" text-anchor="middle" class="small">Scenario, scheduler, and feature metadata</text><text x="281" y="954" text-anchor="middle" class="tiny">Saved as a text manifest</text>
  <path d="M470 925H510" class="wire"/><rect x="510" y="880" width="370" height="90" rx="45" fill="#fff2e1"/><text x="695" y="910" text-anchor="middle" class="h3">Raw Log Evidence</text><text x="695" y="934" text-anchor="middle" class="small">API server, scheduler, and controller logs</text><text x="695" y="954" text-anchor="middle" class="tiny">Stored independently for every case and iteration</text>
  <path d="M880 925H920" class="wire"/><rect x="920" y="880" width="365" height="90" rx="45" fill="#eee9fa"/><text x="1102" y="906" text-anchor="middle" class="h3">Standardized Benchmark Report</text><text x="1102" y="930" text-anchor="middle" class="small">Throughput · latency · binding window</text><text x="1102" y="952" text-anchor="middle" class="tiny">Calculated from Created and Binding events</text>
  <path d="M1285 925H1325" class="wire"/><rect x="1325" y="880" width="380" height="90" rx="45" fill="#e7f5ed"/><text x="1515" y="906" text-anchor="middle" class="h3">Result Publishing</text><text x="1515" y="930" text-anchor="middle" class="small">Scheduler comparisons and performance curves</text><text x="1515" y="952" text-anchor="middle" class="tiny">Exported from Grafana</text>

  <!-- Skills -->
  <path d="M900 982V1016" class="wire"/><text x="70" y="1030" class="section">05 AUTOMATION PACKAGES / SKILLS</text>
  <g>
    <rect x="70" y="1051" width="350" height="126" class="card"/><text x="100" y="1085" class="h2">Environment Setup Skill</text><text x="100" y="1114" class="small">Installs pinned scheduler, controller, and</text><text x="100" y="1136" class="small">admission versions; configures Kind and KWOK</text>
    <rect x="470" y="1051" width="350" height="126" class="card"/><text x="500" y="1085" class="h2">Regular Test Skill</text><text x="500" y="1114" class="small">Runs full or single-scenario tests and</text><text x="500" y="1136" class="small">generates reports and performance charts</text>
    <rect x="870" y="1051" width="350" height="126" class="card"/><text x="900" y="1085" class="h2">Performance Test Skill</text><text x="900" y="1114" class="small">Runs N rounds, removes unstable outliers,</text><text x="900" y="1136" class="small">and generates the averaged report</text>
    <rect x="1270" y="1051" width="460" height="126" class="card"/><text x="1300" y="1085" class="h2">Image Build Skill</text><text x="1300" y="1114" class="small">Builds custom images and pushes them</text><text x="1300" y="1136" class="small">to the specified private registry</text>
  </g>
  <text x="70" y="1210" class="tiny">Design principle: selection dimensions are orthogonal; plugins implement capability contracts; the execution engine is scheduler-agnostic; raw data is decoupled from presentation.</text>
  <text x="1730" y="1210" text-anchor="end" class="tiny">Architecture v1 · English</text>
</svg>
