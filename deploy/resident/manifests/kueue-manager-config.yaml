apiVersion: v1
kind: ConfigMap
metadata:
  name: kueue-manager-config
  namespace: kueue-system
data:
  controller_manager_config.yaml: |
    apiVersion: config.kueue.x-k8s.io/v1beta2
    kind: Configuration
    health:
      healthProbeBindAddress: :8081
    metrics:
      bindAddress: :8443
    webhook:
      port: 9443
    featureGates:
      DisableWaitForPodsReady: true
    leaderElection:
      leaderElect: false
      resourceName: c1f6bfd2.kueue.x-k8s.io
    controller:
      groupKindConcurrency:
        Job.batch: 100
        Workload.kueue.x-k8s.io: 100
        LocalQueue.kueue.x-k8s.io: 100
        Cohort.kueue.x-k8s.io: 100
        ClusterQueue.kueue.x-k8s.io: 100
        ResourceFlavor.kueue.x-k8s.io: 100
    clientConnection:
      qps: 1000
      burst: 1000
    manageJobsWithoutQueueName: false
    managedJobsNamespaceSelector:
      matchLabels:
        benchmark.scheduling/base: kueue
    integrations:
      frameworks:
      - batch/job
